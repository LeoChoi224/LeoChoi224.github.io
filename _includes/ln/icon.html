{%- comment -%}
  프로필 링크 아이콘 (24x24 선 아이콘, 글자색을 따라간다)
  name 값: email, github, facebook, instagram, tistory (포트폴리오는 아이콘이 아니라 글자 버튼)
  목록에 없는 이름이면 기본 링크 아이콘이 나온다
{%- endcomment -%}
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- case include.name -%}
{%- when "email" -%}
<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 7 9 6.5L21 7"/>
{%- when "github" -%}
<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
{%- when "facebook" -%}
<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
{%- when "instagram" -%}
<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
{%- when "tistory" -%}
<g fill="currentColor" stroke="none"><circle cx="5" cy="5.5" r="2.4"/><circle cx="12" cy="5.5" r="2.4"/><circle cx="19" cy="5.5" r="2.4"/><circle cx="12" cy="12.5" r="2.4"/><circle cx="12" cy="19.5" r="2.4"/></g>
{%- else -%}
<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
{%- endcase -%}
</svg>
